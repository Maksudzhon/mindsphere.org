<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Vibrant MindSphere premium gradients -->
    <linearGradient id="purple-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" /> <!-- Radiant Purple -->
      <stop offset="100%" stop-color="#6366f1" /> <!-- Vibrant Indigo -->
    </linearGradient>
    <linearGradient id="cyan-blue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" /> <!-- Vibrant Cyan -->
      <stop offset="100%" stop-color="#3b82f6" /> <!-- Vibrant Blue -->
    </linearGradient>
  </defs>
  
  <!-- Transparent background. The shape itself is a stylized 'MindSphere':
       Interlocking, organic glowing orbits forming a multidimensional sphere of intelligence. -->
  <g fill="none" stroke-linecap="round">
    <!-- Outer orbiting energy waves -->
    <path d="M 16 3 C 21 3, 27 7, 28 12 C 29 17, 25 24, 19 28" stroke="url(#purple-indigo)" stroke-width="2.2" opacity="0.8" />
    <path d="M 16 29 C 11 29, 5 25, 4 20 C 3 15, 7 8, 13 4" stroke="url(#cyan-blue)" stroke-width="2.2" opacity="0.8" />
    
    <!-- Inner neural core connection paths -->
    <path d="M 10 16 C 10 11, 14 9, 16 12 C 18 15, 14 17, 16 20 C 18 23, 22 21, 22 16" stroke="url(#purple-indigo)" stroke-width="2" />
    
    <!-- Glowing synapse connection nodes (Floating spheres of thought) -->
    <!-- Central Node -->
    <circle cx="16" cy="16" r="2.5" fill="url(#cyan-blue)" />
    
    <!-- Outer Connected Nodes -->
    <circle cx="10" cy="16" r="1.8" fill="#c084fc" />
    <circle cx="22" cy="16" r="1.8" fill="#3b82f6" />
    <circle cx="16" cy="9.5" r="1.5" fill="#22d3ee" />
    <circle cx="16" cy="22.5" r="1.5" fill="#818cf8" />
    
    <!-- Fine delicate connection lines -->
    <line x1="10" y1="16" x2="16" y2="16" stroke="#c084fc" stroke-width="0.7" opacity="0.6" />
    <line x1="22" y1="16" x2="16" y2="16" stroke="#3b82f6" stroke-width="0.7" opacity="0.6" />
    <line x1="16" y1="9.5" x2="16" y2="16" stroke="#22d3ee" stroke-width="0.7" opacity="0.6" />
    <line x1="16" y1="22.5" x2="16" y2="16" stroke="#818cf8" stroke-width="0.7" opacity="0.6" />
  </g>
</svg>
